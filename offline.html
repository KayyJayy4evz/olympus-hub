<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olympus is offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #15235A; color: #E8ECFA; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  h1 { margin: 0; font-family: Georgia, serif; letter-spacing: .06em; color: #C9982F; }
  p { margin: 0; color: #A7B2D8; }
  button { font: inherit; border: 0; border-radius: 9px; padding: 10px 16px; background: #C9982F; color: #1A1505; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>OLYMPUS</h1>
  <p>You're offline right now. The hub will be back the moment your connection is.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
